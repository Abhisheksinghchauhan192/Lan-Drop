<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LAN-Drop</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#111;
    color:#eee;
    font-family:system-ui,sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1a1a1a;
    border:1px solid #2a2a2a;
    border-radius:16px;
    padding:24px;
}

h1{
    margin-top:0;
    margin-bottom:8px;
}

.subtitle{
    color:#888;
    margin-bottom:24px;
}

.path{
    background:#151515;
    border:1px solid #2a2a2a;
    border-radius:10px;
    padding:10px 14px;
    color:#aaa;
    margin-bottom:20px;
    word-break:break-all;
}

a{
    color:#10b981;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

.parent-link{
    display:inline-block;
    margin-bottom:18px;
}

ul{
    list-style:none;
    padding:0;
    margin:0;
}

li{
    padding:14px;
    border-bottom:1px solid #2a2a2a;
    transition:background .15s ease;
}

li:hover{
    background:#222;
}

li:last-child{
    border-bottom:none;
}

.size{
    float:right;
    color:#888;
}

.footer{
    text-align:center;
    margin-top:24px;
    color:#666;
    font-size:.85rem;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>📦 LAN-Drop</h1>

<p class="subtitle">
Browse and download shared files
</p>

<div class="path">
📂 {{CURRENT_PATH}}
</div>

<div class="parent-link">
{{PARENT_LINK}}
</div>

<ul>
{{FILE_LIST}}
</ul>

<div class="footer">
LAN-Drop v1.0
</div>

</div>
</div>

</body>
</html>
